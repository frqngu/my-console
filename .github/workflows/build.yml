name: Build Windows installer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get the Widevine build of Electron (same one the console uses now)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri 'https://github.com/castlabs/electron-releases/releases/download/v34.5.8%2Bwvcus/electron-v34.5.8%2Bwvcus-win32-x64.zip' -OutFile electron.zip
          Expand-Archive electron.zip -DestinationPath electron-dist -Force
          Get-ChildItem electron-dist | Select-Object -First 8
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build the PS5 controller bridge and fetch its two drivers (they ship inside the installer)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 https://github.com/pedjaaaaa/Scuf-Omega-PS5-for-PC.git bridge-src
          dotnet publish bridge-src/ScufDualSense.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o bridge-out
          Copy-Item bridge-src/app.ico bridge-out/ -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path bridge-out/drivers | Out-Null
          gh release download --repo nefarius/ViGEmBus --pattern "*x64*" --dir bridge-out/drivers --clobber
          gh release download --repo nefarius/HidHide --pattern "*x64*.exe" --dir bridge-out/drivers --clobber
          Get-ChildItem bridge-out -Recurse | Select-Object FullName, Length
          if (-not (Test-Path bridge-out/ScufDualSense.exe)) { throw 'bridge did not build' }
          exit 0
      - run: pip install castlabs-evs
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: My-Console-Setup
          path: dist/My-Console-Setup.exe
      - name: Publish a download page (GitHub Release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "console-build-${{ github.run_number }}"
          gh release create $tag dist/My-Console-Setup.exe --title "My Console (build ${{ github.run_number }})" --notes "Download My-Console-Setup.exe, run it, and if Windows shows a blue box click More info, then Run anyway." --latest
